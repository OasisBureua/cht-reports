name: Deploy to Development

# Manual only. A git push never deploys.
on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Plan only: skip apply approval and deploy steps'
        type: boolean
        default: false
      deploy_all:
        description: 'Deploy all lanes (ignore change detection)'
        type: boolean
        default: false

concurrency:
  group: deploy-cht-reports-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 233636046512.dkr.ecr.us-east-1.amazonaws.com
  ECR_BACKEND_REPO: cht-reports-dev-service
  ECR_GENERATOR_REPO: cht-reports-dev-generator
  TERRAFORM_VERSION: 1.10.5
  TF_ENV_DIR: infrastructure/terraform/environments/us-east-1
  TF_VAR_FILE: ../variables/dev.github.tfvars
  TF_BACKEND_CONFIG: ../backends/us-east-1-dev.hcl
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read
  issues: write
  actions: read

jobs:
  changes:
    name: Detect deploy scope
    runs-on: ubuntu-latest
    outputs:
      deploy_backend: ${{ steps.scope.outputs.deploy_backend }}
      deploy_lambda: ${{ steps.scope.outputs.deploy_lambda }}
      deploy_infra: ${{ steps.scope.outputs.deploy_infra }}
      base_sha: ${{ steps.base.outputs.base_sha }}
      base_source: ${{ steps.base.outputs.base_source }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve change base
        if: github.event.inputs.deploy_all != 'true'
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/ci-resolve-deploy-base.sh
          ./scripts/ci-resolve-deploy-base.sh \
            "${{ github.event_name }}" \
            "${{ github.event.before || '' }}" \
            "deploy-dev.yml" \
            "${{ github.ref_name }}" \
            "origin/develop"

      - name: Detect changed paths
        if: github.event.inputs.deploy_all != 'true' && steps.base.outputs.base_resolved == 'true'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          ref: ${{ github.sha }}
          base: ${{ steps.base.outputs.base_sha }}
          list-files: shell
          filters: |
            backend:
              - 'backend/**'
            lambda:
              - 'lambdas/**'
            infra:
              - 'infrastructure/**'

      - name: Set deploy scope
        id: scope
        run: |
          chmod +x scripts/ci-detect-deploy-scope.sh
          FORCE_ALL=false
          if [ "${{ github.event.inputs.deploy_all }}" = "true" ]; then
            FORCE_ALL=true
          elif [ "${{ steps.base.outputs.base_resolved || 'false' }}" != "true" ]; then
            echo "No change base SHA; deploying all lanes."
            FORCE_ALL=true
          fi
          ./scripts/ci-detect-deploy-scope.sh \
            "$FORCE_ALL" \
            "${{ steps.filter.outputs.backend || 'false' }}" \
            "${{ steps.filter.outputs.lambda || 'false' }}" \
            "${{ steps.filter.outputs.infra || 'false' }}"

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_lambda == 'true' || needs.changes.outputs.deploy_infra == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend - Install, test, build
        if: needs.changes.outputs.deploy_backend == 'true'
        working-directory: ./backend
        run: |
          npm ci
          npm test
          npm run build

      - name: Setup Python
        if: needs.changes.outputs.deploy_lambda == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: lambdas/generator/requirements.txt

      - name: Lambda - Tests
        if: needs.changes.outputs.deploy_lambda == 'true'
        working-directory: ./lambdas/generator
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest

      - name: Setup Terraform
        if: needs.changes.outputs.deploy_infra == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform validate
        if: needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          terraform init -backend=false
          terraform validate

  deploy:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: [changes, test]
    if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_lambda == 'true' || needs.changes.outputs.deploy_infra == 'true'
    environment: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Deploy scope summary
        run: |
          echo "## Deploy scope" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lane | Run |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend (image) | ${{ needs.changes.outputs.deploy_backend }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lambda (image + Terraform pin) | ${{ needs.changes.outputs.deploy_lambda }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Infra (Terraform plan/apply) | ${{ needs.changes.outputs.deploy_infra }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Change base: \`${{ needs.changes.outputs.base_sha || 'n/a' }}\` (${{ needs.changes.outputs.base_source || 'n/a' }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_lambda == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_lambda == 'true'
        id: meta
        run: |
          chmod +x scripts/next-dev-image-tag.sh
          IMAGE_TAG="$(./scripts/next-dev-image-tag.sh ${{ env.ECR_BACKEND_REPO }} "$AWS_REGION")"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: ${IMAGE_TAG}"

      - name: Set up Docker Buildx
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_lambda == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push generator image
        if: needs.changes.outputs.deploy_lambda == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./lambdas/generator
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_GENERATOR_REPO }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_GENERATOR_REPO }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Terraform
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_lambda == 'true' || needs.changes.outputs.deploy_infra == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Verify GitHub Environment secrets
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_lambda == 'true' || needs.changes.outputs.deploy_infra == 'true'
        run: ./scripts/verify-github-env-secrets.sh development

      - name: Terraform Init
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_lambda == 'true' || needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform init -reconfigure -backend-config="${{ env.TF_BACKEND_CONFIG }}"

      - name: Terraform Plan
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_lambda == 'true' || needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          EXTRA_VARS=()
          if [ "${{ needs.changes.outputs.deploy_backend }}" = "true" ]; then
            EXTRA_VARS+=(
              -var="reports_service_image_uri=${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.meta.outputs.image_tag }}"
            )
          fi
          if [ "${{ needs.changes.outputs.deploy_lambda }}" = "true" ]; then
            EXTRA_VARS+=(
              -var="lambda_images={\"generator\":\"${{ env.ECR_REGISTRY }}/${{ env.ECR_GENERATOR_REPO }}:${{ steps.meta.outputs.image_tag }}\"}"
            )
          else
            chmod +x "${{ github.workspace }}/scripts/ci-resolve-lambda-images-from-state.sh"
            eval "$("${{ github.workspace }}/scripts/ci-resolve-lambda-images-from-state.sh")"
            EXTRA_VARS+=(
              -var="lambda_images={\"generator\":\"${GENERATOR_IMAGE}\"}"
            )
          fi
          terraform plan \
            -var-file="${{ env.TF_VAR_FILE }}" \
            "${EXTRA_VARS[@]}" \
            -out=tfplan
        env:
          TF_VAR_contenthub_api_key: ${{ secrets.CONTENTHUB_API_KEY }}

      - name: Plan summary
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_lambda == 'true' || needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          echo "## Terraform plan summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -json tfplan | jq -r '
            .resource_changes[]
            | select(.change.actions != ["no-op"])
            | "\(.change.actions | join(",")): \(.address)"
          ' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event.inputs.plan_only }}" = "true" ]; then
            echo "Plan only: apply skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Awaiting approval to run terraform apply." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Approve Terraform apply
        if: (needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_lambda == 'true' || needs.changes.outputs.deploy_infra == 'true') && github.event.inputs.plan_only != 'true'
        uses: trstringer/manual-approval@v1
        timeout-minutes: 120
        with:
          secret: ${{ github.token }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Approve dev Terraform apply (run #${{ github.run_number }})"
          issue-body: |
            Review the Terraform plan for workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.

            Comment **approve** to apply. Comment **deny** to cancel.

      - name: Terraform Apply
        if: (needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_lambda == 'true' || needs.changes.outputs.deploy_infra == 'true') && github.event.inputs.plan_only != 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform apply tfplan

      - name: Smoke invoke generator
        if: needs.changes.outputs.deploy_lambda == 'true' && github.event.inputs.plan_only != 'true'
        run: |
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh dev

      - name: Deployment Summary
        if: always()
        run: |
          echo "## CHT Reports dev deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend lane | ${{ needs.changes.outputs.deploy_backend }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lambda lane | ${{ needs.changes.outputs.deploy_lambda }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Infra lane | ${{ needs.changes.outputs.deploy_infra }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag | \`${{ steps.meta.outputs.image_tag || 'n/a' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
