name: Deploy to Production

# Manual only. A git push (including to main) never deploys.
on:
  workflow_dispatch:
    inputs:
      plan_only:
        description: 'Plan only: skip apply approval and deploy steps'
        type: boolean
        default: false
      deploy_all:
        description: 'Deploy all lanes (ignore change detection)'
        type: boolean
        default: false
      image_tag:
        description: 'Roll back: run this existing worker image tag instead of building (e.g. v1.0.12). Run from main.'
        type: string
        default: ''

concurrency:
  group: deploy-cht-reports-production
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 233636046512.dkr.ecr.us-east-1.amazonaws.com
  ECR_BACKEND_REPO: cht-reports-prod-service
  TERRAFORM_VERSION: 1.10.5
  TF_ENV_DIR: infrastructure/terraform/environments/us-east-1
  TF_VAR_FILE: ../variables/production.github.tfvars
  TF_BACKEND_CONFIG: ../backends/us-east-1-production.hcl
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  id-token: write
  contents: read
  issues: write
  actions: read

jobs:
  gate:
    name: Check deploy trigger
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      checkout_ref: ${{ steps.check.outputs.checkout_ref }}
    steps:
      - name: Evaluate trigger
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          case "$EVENT_NAME" in
            workflow_dispatch)
              if [ -n "$IMAGE_TAG" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
                echo "::error::Run the production rollback (image_tag) from main (got ${GITHUB_REF})."
                exit 1
              fi
              echo "should_deploy=true" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
              ;;
            push)
              if [ "$REF_NAME" = "main" ]; then
                echo "should_deploy=true" >> "$GITHUB_OUTPUT"
                echo "checkout_ref=refs/heads/main" >> "$GITHUB_OUTPUT"
              else
                echo "should_deploy=false" >> "$GITHUB_OUTPUT"
                echo "checkout_ref=" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "checkout_ref=" >> "$GITHUB_OUTPUT"
              ;;
          esac

  changes:
    name: Detect deploy scope
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.should_deploy == 'true'
    outputs:
      deploy_backend: ${{ steps.scope.outputs.deploy_backend }}
      deploy_infra: ${{ steps.scope.outputs.deploy_infra }}
      base_sha: ${{ steps.base.outputs.base_sha }}
      base_source: ${{ steps.base.outputs.base_source }}
      image_tag: ${{ steps.scope.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.gate.outputs.checkout_ref }}

      - name: Resolve change base
        if: github.event.inputs.deploy_all != 'true' && github.event.inputs.image_tag == ''
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x scripts/ci-resolve-deploy-base.sh
          ./scripts/ci-resolve-deploy-base.sh \
            "${{ github.event_name }}" \
            "${{ github.event.before || '' }}" \
            "deploy-prod.yml" \
            "main" \
            "origin/main"

      - name: Detect changed paths
        if: github.event.inputs.deploy_all != 'true' && steps.base.outputs.base_resolved == 'true'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          ref: ${{ github.sha }}
          base: ${{ steps.base.outputs.base_sha }}
          list-files: shell
          filters: |
            backend:
              - 'backend/**'
            infra:
              - 'infrastructure/**'

      - name: Set deploy scope
        id: scope
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          chmod +x scripts/ci-detect-deploy-scope.sh
          if [ -n "$IMAGE_TAG" ]; then
            # Rollback: no build or tests, plan/apply with the given image.
            if ! [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Invalid image tag: ${IMAGE_TAG}"
              exit 1
            fi
            echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
            ./scripts/ci-detect-deploy-scope.sh false false true
            exit 0
          fi
          FORCE_ALL=false
          if [ "${{ github.event.inputs.deploy_all }}" = "true" ]; then
            FORCE_ALL=true
          elif [ "${{ steps.base.outputs.base_resolved || 'false' }}" != "true" ]; then
            echo "No change base SHA; deploying all lanes."
            FORCE_ALL=true
          fi
          ./scripts/ci-detect-deploy-scope.sh \
            "$FORCE_ALL" \
            "${{ steps.filter.outputs.backend || 'false' }}" \
            "${{ steps.filter.outputs.infra || 'false' }}"

  test:
    name: Run tests
    runs-on: ubuntu-latest
    needs: [gate, changes]
    if: |
      needs.gate.outputs.should_deploy == 'true' && needs.changes.outputs.image_tag == '' && (
        needs.changes.outputs.deploy_backend == 'true' ||
        needs.changes.outputs.deploy_infra == 'true'
      )
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend - Install, test, build
        if: needs.changes.outputs.deploy_backend == 'true'
        working-directory: ./backend
        run: |
          npm ci
          npm test
          npm run build

      - name: Setup Terraform
        if: needs.changes.outputs.deploy_infra == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform validate
        if: needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          terraform init -backend=false
          terraform validate

  deploy:
    name: Deploy to Platform
    runs-on: ubuntu-latest
    needs: [gate, changes, test]
    # test is skipped on rollback (image_tag) runs.
    if: |
      !cancelled() && needs.changes.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      needs.gate.outputs.should_deploy == 'true' && (
        needs.changes.outputs.deploy_backend == 'true' ||
        needs.changes.outputs.deploy_infra == 'true'
      )
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.gate.outputs.checkout_ref }}

      - name: Deploy scope summary
        run: |
          echo "## Deploy scope" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lane | Run |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend (image) | ${{ needs.changes.outputs.deploy_backend }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Infra (Terraform plan/apply) | ${{ needs.changes.outputs.deploy_infra }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Rollback image tag | ${{ needs.changes.outputs.image_tag || 'n/a' }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        if: needs.changes.outputs.deploy_backend == 'true'
        run: |
          repo="${{ env.ECR_BACKEND_REPO }}"
          if ! aws ecr describe-repositories --repository-names "$repo" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Creating ECR repository: $repo"
            aws ecr create-repository --repository-name "$repo" --region "$AWS_REGION" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 \
              --tags Key=Project,Value=cht-reports Key=Environment,Value=production
          fi

      - name: Generate image tag
        if: needs.changes.outputs.deploy_backend == 'true'
        id: meta
        run: |
          chmod +x scripts/next-prod-image-tag.sh
          IMAGE_TAG="$(./scripts/next-prod-image-tag.sh ${{ env.ECR_BACKEND_REPO }} "$AWS_REGION")"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: ${IMAGE_TAG}"

      - name: Check the rollback image exists
        if: needs.changes.outputs.image_tag != ''
        env:
          IMAGE_TAG: ${{ needs.changes.outputs.image_tag }}
        run: |
          aws ecr describe-images --repository-name "$ECR_BACKEND_REPO" --image-ids imageTag="$IMAGE_TAG" \
            --region "$AWS_REGION" --query 'imageDetails[0].imagePushedAt' --output text

      - name: Set up Docker Buildx
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        if: needs.changes.outputs.deploy_backend == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:prod-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Terraform
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_infra == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Verify GitHub Environment secrets
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_infra == 'true'
        run: ./scripts/verify-github-env-secrets.sh production

      - name: Terraform Init
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform init -reconfigure -backend-config="${{ env.TF_BACKEND_CONFIG }}"

      - name: Terraform Plan
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_infra == 'true'
        id: plan
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          EXTRA_VARS=()
          chmod +x "${{ github.workspace }}/scripts/ci-resolve-service-image-from-state.sh"
          if terraform state list 2>/dev/null | grep -q .; then
            eval "$("${{ github.workspace }}/scripts/ci-resolve-service-image-from-state.sh")"
          else
            echo "Empty Terraform state: using tfvars image pins unless this run builds them."
          fi
          if [ "${{ needs.changes.outputs.deploy_backend }}" = "true" ]; then
            REPORTS_SERVICE_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${{ steps.meta.outputs.image_tag }}"
          elif [ -n "$ROLLBACK_TAG" ]; then
            REPORTS_SERVICE_IMAGE="${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPO }}:${ROLLBACK_TAG}"
          fi
          echo "service_image=${REPORTS_SERVICE_IMAGE:-}" >> "$GITHUB_OUTPUT"
          if [ -n "${REPORTS_SERVICE_IMAGE:-}" ]; then
            EXTRA_VARS+=(-var="reports_service_image_uri=${REPORTS_SERVICE_IMAGE}")
          fi
          terraform plan \
            -var-file="${{ env.TF_VAR_FILE }}" \
            "${EXTRA_VARS[@]}" \
            -out=tfplan
        env:
          ROLLBACK_TAG: ${{ needs.changes.outputs.image_tag }}
          TF_VAR_contenthub_api_key: ${{ secrets.CONTENTHUB_API_KEY }}

      - name: Plan summary
        if: needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_infra == 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: |
          echo "## Terraform plan summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          terraform show -json tfplan | jq -r '
            .resource_changes[]
            | select(.change.actions != ["no-op"])
            | "\(.change.actions | join(",")): \(.address)"
          ' >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Approve Terraform apply
        if: (needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_infra == 'true') && github.event.inputs.plan_only != 'true'
        uses: trstringer/manual-approval@v1
        timeout-minutes: 120
        with:
          secret: ${{ github.token }}
          approvers: ${{ github.actor }}
          minimum-approvals: 1
          issue-title: "Approve production Terraform apply (run #${{ github.run_number }})"
          issue-body: |
            Review the Terraform plan for workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.

            Comment **approve** to apply. Comment **deny** to cancel.

      - name: Re-assume AWS role after approval
        if: (needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_infra == 'true') && github.event.inputs.plan_only != 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Apply
        if: (needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_infra == 'true') && github.event.inputs.plan_only != 'true'
        working-directory: ${{ env.TF_ENV_DIR }}
        run: terraform apply tfplan

      - name: Wait for the report worker
        if: (needs.changes.outputs.deploy_backend == 'true' || needs.changes.outputs.deploy_infra == 'true') && github.event.inputs.plan_only != 'true'
        env:
          EXPECTED_IMAGE: ${{ steps.plan.outputs.service_image }}
        run: |
          chmod +x scripts/smoke.sh
          ./scripts/smoke.sh production "$AWS_REGION" "$EXPECTED_IMAGE"

      - name: Deployment Summary
        if: always()
        run: |
          echo "## CHT Reports production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image tag | \`${{ steps.meta.outputs.image_tag || needs.changes.outputs.image_tag || 'n/a' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
