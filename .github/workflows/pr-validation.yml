name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend - Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend - Lint
        working-directory: ./backend
        run: npm run lint || echo "Linting not configured"

      - name: Backend - Type check
        working-directory: ./backend
        run: npm run build

      - name: Backend - Tests
        working-directory: ./backend
        run: npm test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lambda - Install and test
        working-directory: ./lambdas/generator
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5

      - name: Terraform validate
        working-directory: infrastructure/terraform/environments/us-east-1
        run: |
          terraform init -backend=false
          terraform validate

      - name: Comment on PR
        uses: actions/github-script@v9
        if: always()
        with:
          script: |
            const success = '${{ job.status }}' === 'success';
            const icon = success ? '✅' : '❌';
            const status = success ? 'All checks passed!' : 'Some checks failed';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${icon} **PR Validation:** ${status}`
            })
